<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Photo Reel</title>
<style>
:root{
  --orange:#FF8C00;
  --bg:#0a0a0a;
  --ink:#f5f2ec;
  --muted:rgba(245,242,236,.62);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior-y:none}
body{overflow:hidden}

/* ---------- scroll container ---------- */
#reel{
  height:100dvh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
#reel::-webkit-scrollbar{display:none}

.slide{
  position:relative;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#000;
}
.slide img{
  position:relative;   /* needed so z-index applies */
  z-index:2;           /* image sits ABOVE the blurred backdrop */
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:0;
  transition:opacity .35s ease;
}
.slide img.ready{opacity:1}

/* blurred backdrop so portrait images never sit on dead black */
.slide .backdrop{
  position:absolute;inset:-8%;
  z-index:0;           /* bottom layer */
  background-size:cover;background-position:center;
  filter:blur(34px) saturate(1.2) brightness(.42);
  transform:scale(1.1);
}

/* skeleton while the image is still coming */
.slide .skeleton{
  position:absolute;inset:0;
  z-index:1;           /* under the image, over the backdrop */
  background:linear-gradient(100deg,#121212 30%,#1c1712 50%,#121212 70%);
  background-size:220% 100%;
  animation:shimmer 1.4s linear infinite;
}
.slide.loaded .skeleton{display:none}
@keyframes shimmer{to{background-position:-120% 0}}

/* ---------- full-slide click layer ---------- */
.hit{
  position:absolute;
  inset:0;
  z-index:3;           /* above the image, below the CTA */
  display:block;
  cursor:pointer;
}

/* ---------- CTA (last slide only, optional) ---------- */
.cta{
  position:absolute;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  transform:translateX(-50%);
  z-index:4;
  padding:13px 26px;
  background:#111;
  color:var(--ink);
  border:1px solid var(--orange);
  border-radius:999px;
  font:inherit;font-size:15px;font-weight:600;
  white-space:nowrap;
  text-decoration:none;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.cta:active{background:#1a1206}

/* ---------- progress rail ---------- */
#rail{
  position:fixed;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:5;
  pointer-events:none;
}
#rail i{
  display:block;
  width:3px;
  height:15px;
  border-radius:2px;
  background:rgba(245,242,236,.24);
  transition:background .25s ease,height .25s ease;
}
#rail i.on{background:var(--orange);height:26px}

/* ---------- counter ---------- */
#count{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  right:14px;
  z-index:5;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px);
  padding:5px 10px;
  border-radius:999px;
}
#count b{color:var(--ink);font-weight:600}

/* ---------- swipe hint (arrow only) ---------- */
#hint{
  position:fixed;
  left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateX(-50%);
  z-index:6;
  transition:opacity .4s ease;
}
#hint.gone{opacity:0;pointer-events:none}
#hint svg{animation:nudge 1.6s ease-in-out infinite;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
@keyframes nudge{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
  #hint svg,.slide .skeleton{animation:none}
  .slide img{transition:none}
}
</style>
</head>
<body>

<div id="reel" tabindex="0" aria-label="Photo reel"></div>

<div id="count"><b>1</b> / <span id="total">0</span></div>
<nav id="rail" aria-hidden="true"></nav>

<div id="hint" aria-hidden="true">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8C00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
</div>

<script>
/* =========================================================
   1. EDIT ONLY THIS BLOCK — just image URLs now
   e.g. "https://instantchatroom.org/reel/01.jpg"
   ========================================================= */
const SLIDES = [
  "https://instantchatroom.org/USA%20IMAGE/image%202.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%201.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%203.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%204.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%205.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%206.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%207.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%208.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%209.PNG",
  "https://instantchatroom.org/USA%20IMAGE/image%2010.jpg",
  "https://instantchatroom.org/USA%20IMAGE/image%2011.jpg",
  "https://instantchatroom.org/USA%20IMAGE/image%2012.jpg",
  "https://instantchatroom.org/USA%20IMAGE/image%2013.jpg",
  "https://instantchatroom.org/USA%20IMAGE/image%2014.jpg",
  "https://instantchatroom.org/USA%20IMAGE/image%2015.jpg"
];

/* ---- 2. YOUR 5 ARTICLE URLs ----
   Slide 1 -> link 1, slide 2 -> link 2 ... slide 6 -> link 1 again.
   Paste your real article URLs in place of these. */
const LINKS = [
  "https://usa.msfcfinance.in/study-in-usa-universities-2026-cost-loans-visa-salary-and-best-universities-for-international-students-%f0%9f%87%ba%f0%9f%87%b8/",
  "https://usa.msfcfinance.in/study-in-uk-universities-2026-tuition-fees-mba-cost-scholarships-student-visa-bank-balance-and-graduate-salary-roi/",
  "https://usa.msfcfinance.in/study-in-new-zealand-2026-2027-university-fees-student-visa-education-loans-ielts-score-salary-pr-complete-tier-1-guide/",
  "https://usa.msfcfinance.in/study-in-australia-2026-complete-guide-for-international-students-universities-fees-visa-loans-pr-high-salary-careers/",
  "https://usa.msfcfinance.in/study-in-canada-2026-complete-guide-for-international-students-universities-tuition-fees-visa-loans-scholarships-salary-and-pr/"
];

/* "_self" = open in same tab. "_blank" = open in new tab. */
const LINK_TARGET = "_self";

/* CTA on the last slide. Set url to "" to hide it entirely. */
const CTA = { label:"Continue", url:"" };

/* Optional: auto-advance. 0 = off. e.g. 6000 = move on after 6s. */
const AUTO_ADVANCE_MS = 0;
/* ========================================================= */

/* ---- 3. ROTATION ON RETURN ----
   Each time the visitor comes back from an article, the image list and the
   link list are rotated by these steps, so the reel opens on a different
   image and the image->article pairing changes.
   Set both to 0 to switch rotation off. */
const IMAGE_ROTATE_STEP = 7;   /* 15 images, step 7 -> 15 different starts */
const LINK_ROTATE_STEP  = 2;   /* 5 links, step 2 -> pairing changes too   */
/* ========================================================= */

const reel = document.getElementById('reel');
const rail = document.getElementById('rail');
const hint = document.getElementById('hint');
const cur  = document.querySelector('#count b');
document.getElementById('total').textContent = SLIDES.length;

/* --- how many times has this visitor already left and come back? --- */
const VISIT_KEY = 'reel_visit';
function getVisit(){
  try { return parseInt(sessionStorage.getItem(VISIT_KEY) || '0', 10) || 0; }
  catch(e){ return 0; }   /* private mode / storage blocked -> no rotation */
}
function bumpVisit(){
  try { sessionStorage.setItem(VISIT_KEY, String(getVisit() + 1)); } catch(e){}
}

/* rotate an array left by n positions */
function rotate(arr, n){
  if(!arr.length || !n) return arr.slice();
  const k = ((n % arr.length) + arr.length) % arr.length;
  return arr.slice(k).concat(arr.slice(0, k));
}

let slides = [], dots = [], active = 0, timer = null;
let loader = null, tracker = null, hintTimer = null;

function build(){
  const visit  = getVisit();
  const images = rotate(SLIDES, visit * IMAGE_ROTATE_STEP);
  const links  = rotate(LINKS,  visit * LINK_ROTATE_STEP);

  /* tear down the previous render */
  if(loader)  loader.disconnect();
  if(tracker) tracker.disconnect();
  clearTimeout(timer);
  clearTimeout(hintTimer);
  reel.innerHTML = '';
  rail.innerHTML = '';

  images.forEach((src,i)=>{
    const sec = document.createElement('section');
    sec.className = 'slide';
    sec.dataset.index = i;

    const back = document.createElement('div');
    back.className = 'backdrop';

    const skel = document.createElement('div');
    skel.className = 'skeleton';

    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.dataset.src = src;
    if(i < 2){ img.src = src; }            // first two load immediately
    img.addEventListener('load', ()=>{
      img.classList.add('ready');
      sec.classList.add('loaded');
      back.style.backgroundImage = `url("${img.currentSrc||img.src}")`;
    });
    /* already-cached images fire load before this listener attaches */
    if(img.complete && img.naturalWidth){
      img.classList.add('ready');
      sec.classList.add('loaded');
      back.style.backgroundImage = `url("${img.currentSrc||img.src}")`;
    }

    sec.append(back, skel, img);

    /* full-slide click layer -> article */
    if(links.length){
      const hit = document.createElement('a');
      hit.className = 'hit';
      hit.href = links[i % links.length];
      hit.target = LINK_TARGET;
      hit.rel = 'noopener';
      hit.setAttribute('aria-label','Open article');
      let sy = 0, sx = 0;
      hit.addEventListener('touchstart', e=>{
        sy = e.touches[0].clientY; sx = e.touches[0].clientX;
      }, {passive:true});
      hit.addEventListener('touchend', e=>{
        const t = e.changedTouches[0];
        /* a swipe moved more than 12px -> not a tap, cancel the link */
        if(Math.abs(t.clientY - sy) > 12 || Math.abs(t.clientX - sx) > 12){
          e.preventDefault();
        }
      });
      /* count this as a visit, so the next view rotates */
      hit.addEventListener('click', ()=>{ bumpVisit(); });
      sec.appendChild(hit);
    }

    if(CTA.url && i === images.length-1){
      const a = document.createElement('a');
      a.className = 'cta';
      a.href = CTA.url;
      a.textContent = CTA.label;
      a.addEventListener('click', ()=>{ bumpVisit(); });
      sec.appendChild(a);
    }

    reel.appendChild(sec);

    const dot = document.createElement('i');
    if(i===0) dot.classList.add('on');
    rail.appendChild(dot);
  });

  slides = [...reel.children];
  dots   = [...rail.children];
  active = 0;
  cur.textContent = '1';

  /* lazy load with a 2-slide lookahead */
  loader = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      const i = +e.target.dataset.index;
      for(let k=i; k<=i+2 && k<slides.length; k++){
        const im = slides[k].querySelector('img');
        if(im && !im.src) im.src = im.dataset.src;
      }
    });
  },{ root:reel, rootMargin:'150% 0px' });
  slides.forEach(s=>loader.observe(s));

  /* active-slide tracking */
  tracker = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.intersectionRatio < 0.6) return;
      active = +e.target.dataset.index;
      cur.textContent = active + 1;
      dots.forEach((d,i)=>d.classList.toggle('on', i===active));
      if(active > 0) hint.classList.add('gone');
      schedule();
    });
  },{ root:reel, threshold:[0.6] });
  slides.forEach(s=>tracker.observe(s));

  /* back to the top and show the hint again */
  reel.scrollTop = 0;
  hint.classList.remove('gone');
  hintTimer = setTimeout(()=>hint.classList.add('gone'), 5000);

  schedule();
}

function go(i){
  if(i < 0 || i >= slides.length) return;
  slides[i].scrollIntoView({ behavior:'smooth', block:'start' });
}

/* optional auto-advance */
function schedule(){
  clearTimeout(timer);
  if(!AUTO_ADVANCE_MS) return;
  timer = setTimeout(()=>{
    go(active + 1 < slides.length ? active + 1 : 0);
  }, AUTO_ADVANCE_MS);
}

/* keyboard */
window.addEventListener('keydown', ev=>{
  if(ev.key==='ArrowDown' || ev.key==='PageDown' || ev.key===' '){ ev.preventDefault(); go(active+1); }
  if(ev.key==='ArrowUp'   || ev.key==='PageUp'){ ev.preventDefault(); go(active-1); }
});

/* first render */
build();

/* returning from an article:
   - persisted = true  -> restored from the browser's back/forward cache
   - persisted = false -> a normal reload, already handled by build() above */
window.addEventListener('pageshow', (e)=>{
  if(e.persisted) build();
});

</script>
</body>
</html>
